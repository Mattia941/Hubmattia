name: Compilazione Plugin Minecraft

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Configura il sistema con Java 17 per la compilazione Spigot
      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compila il plugin e genera il file .jar usando Maven
      - name: Compila il plugin con Maven
        run: mvn clean package --batch-mode

      # 4. Salva il file .jar generato negli Artifacts di GitHub
      - name: Salva il file .jar (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: HubItems-Plugin
          path: target/*.jar
